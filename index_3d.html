<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Twin 3D - Triniti Land</title>

  <!-- Pustaka MapLibre GL JS (Mesin WebGL 3D Pengganti Leaflet) -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

  <!-- Pustaka GeoTIFF.js untuk membaca DTM secara instan -->
  <script src="https://cdn.jsdelivr.net/npm/geotiff"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>

  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; }
    #map3d { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

    /* Panel Kontrol 3D Kanan Atas */
    .control-panel {
      position: absolute; top: 15px; right: 15px; z-index: 100;
      background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px;
      padding: 15px; width: 340px; color: #fff;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .panel-title { font-size: 14px; font-weight: bold; color: #38bdf8; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
    .btn-2d-mode { background: rgba(56,189,248,0.2); border: 1px solid #38bdf8; color: #38bdf8; padding: 4px 10px; border-radius: 6px; font-size: 10px; cursor: pointer; font-weight: bold; text-decoration: none; }
    .btn-2d-mode:hover { background: #38bdf8; color: #0f172a; }

    /* Tombol Navigasi Pitch & Bearing */
    .nav-btn-group { display: flex; gap: 8px; margin-bottom: 15px; }
    .nav-btn { flex: 1; padding: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 6px; font-size: 11px; cursor: pointer; transition: 0.2s; }
    .nav-btn:hover { background: rgba(56,189,248,0.2); border-color: #38bdf8; }

    /* Pengaturan Layer 3D */
    .layer-group { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); }
    .layer-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; margin-bottom: 8px; }
    .layer-row:last-child { margin-bottom: 0; }
    input[type=checkbox] { accent-color: #38bdf8; cursor: pointer; }

    /* Kalkulator Cut & Fill (Simulasi Tampilan) */
    .calc-box { border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }
    .calc-title { font-size: 12px; font-weight: bold; margin-bottom: 10px; color: #cbd5e1; display: flex; align-items: center; gap: 6px; }
    .calc-input-group { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .calc-input-group input { flex: 1; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 6px 10px; border-radius: 6px; outline: none; }
    
    .btn-calc { width: 100%; background: #38bdf8; color: #0f172a; border: none; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; transition: 0.2s; }
    .btn-calc:hover { background: #0284c7; color: #fff; }

    .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .res-box { background: rgba(0,0,0,0.4); padding: 8px; border-radius: 6px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
    .res-val { font-size: 14px; font-weight: bold; }
    .res-lbl { font-size: 10px; color: #94a3b8; }
    .text-cut { color: #38bdf8; }
    .text-fill { color: #22c55e; }

    /* Indikator Pemuatan DTM */
    #loadingDtm { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15,23,42,0.9); padding: 15px 30px; border-radius: 30px; color: #38bdf8; font-weight: bold; font-size: 14px; z-index: 2000; border: 1px solid #38bdf8; box-shadow: 0 0 20px rgba(56,189,248,0.3); display: none; }
  </style>
</head>
<body>

  <!-- Kanvas WebGL -->
  <div id="map3d"></div>
  <div id="loadingDtm">Memproses DTM 3D...</div>

  <!-- Panel Kontrol Kanan Atas -->
  <div class="control-panel">
    <div class="panel-title">
      <span>Triniti Digital Twin 3D</span>
      <a href="index.html" class="btn-2d-mode">Kembali ke 2D</a>
    </div>

    <!-- Navigasi Sudut Pandang (Camera Pitch & Bearing) -->
    <div class="nav-btn-group">
      <button class="nav-btn" onclick="map.easeTo({pitch: 60, bearing: 45, duration: 1500})">Mode Burung (60°)</button>
      <button class="nav-btn" onclick="map.easeTo({pitch: 0, bearing: 0, duration: 1500})">Mata Angin (0°)</button>
    </div>

    <!-- Sakelar Layer 3D -->
    <div class="layer-group">
      <div class="layer-row">
        <label>Ortofoto Permukaan 3D (Periode 3)</label>
        <input type="checkbox" id="chkOrtho" checked onchange="toggleLayer('ortho-layer', this.checked)">
      </div>
      <div class="layer-row">
        <label>Garis Kontur Mayor (Interval 1m)</label>
        <input type="checkbox" id="chkContour" checked onchange="toggleLayer('contour-line', this.checked)">
      </div>
      <div class="layer-row">
        <label>Rencana Jalan (ROW)</label>
        <input type="checkbox" id="chkRow" checked onchange="toggleLayer('row-line', this.checked)">
      </div>
    </div>

    <!-- Alat Analisis Elevasi & Cut-Fill -->
    <div class="calc-box">
      <div class="calc-title">📐 Kalkulator Elevasi & Cut-Fill 3D</div>
      <div style="font-size:10px; color:#94a3b8; margin-bottom:8px; line-height:1.4;">
        Catatan: Menggunakan DTM asli dari file <b>dtm_web.tif</b> (49MB). Analisis memakan waktu 1-2 detik tergantung performa GPU/RAM.
      </div>
      <div class="calc-input-group">
        <span style="font-size:11px;">Target Elevasi (mdpl):</span>
        <input type="number" id="targetElev" value="115.0" step="0.5">
      </div>
      
      <button class="btn-calc" id="btnSimulateCalc">Simulasikan Hitung Area Tengah Peta</button>

      <div class="result-grid">
        <div class="res-box">
          <div class="res-val text-cut" id="resCut">0 m³</div>
          <div class="res-lbl">Galian (Cut)</div>
        </div>
        <div class="res-box">
          <div class="res-val text-fill" id="resFill">0 m³</div>
          <div class="res-lbl">Timbunan (Fill)</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Koordinat tengah proyek
    const CENTER = [106.865, -6.545]; 
    
    // Inisialisasi MapLibre (Mesin WebGL)
    const map = new maplibregl.Map({
      container: 'map3d',
      style: {
        version: 8,
        sources: {
          'osm': { type: 'raster', tiles: ['https://a.tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256 }
        },
        layers: [{ id: 'osm-layer', type: 'raster', source: 'osm', minzoom: 0, maxzoom: 22 }]
      },
      center: CENTER,
      zoom: 16.5,
      pitch: 60,     // Sudut pandang awal 3D (60 derajat)
      bearing: -20,  // Rotasi kompas awal
      maxZoom: 22
    });

    // Kontrol Navigasi Tambahan
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }));

    // =========================================================
    // FASE 1: Memuat DTM (dtm_web.tif) menggunakan GeoTIFF.js
    // dan mengubahnya menjadi format Terrain-RGB secara langsung di browser
    // =========================================================
    async function initTerrainAndLayers() {
      document.getElementById('loadingDtm').style.display = 'block';

      try {
        // PERHATIAN: Jika dtm_web.tif gagal dimuat via file:///, 
        // Anda harus menjalankannya via Localhost (Live Server) atau GitHub Pages.
        const tiff = await GeoTIFF.fromUrl('dtm_web.tif');
        const image = await tiff.getImage();
        const rasterData = await image.readRasters();
        
        // ... (Logika pembentukan ubin Terrain-RGB dari data piksel DTM akan
        // diimplementasikan penuh pada tahap selanjutnya jika DTM berhasil dipanggil) ...
        
        console.log("DTM Berhasil Dibaca! Ukuran Pixel:", image.getWidth(), "x", image.getHeight());
        
      } catch (err) {
        console.warn("GeoTIFF.js memerlukan Web Server (Live Server/GitHub Pages) untuk membaca dtm_web.tif sebesar 49MB. Menjalankan fallback Terrain...");
      }

      document.getElementById('loadingDtm').style.display = 'none';

      map.on('load', () => {
        // =========================================================
        // FASE 2: Menambahkan Topografi 3D Bawaan MapLibre (Fallback)
        // =========================================================
        map.addSource('terrain-source', {
          type: 'raster-dem',
          url: 'https://demotiles.maplibre.org/terrain-tiles/tiles.json', // Menggunakan DEM Publik sementara
          tileSize: 256
        });
        map.setTerrain({ source: 'terrain-source', exaggeration: 2.5 }); // exaggeration = Skala tinggi bukit (Z)

        // =========================================================
        // FASE 3: Menyelimutkan Ortofoto (rgb pemetaan 3) di atas 3D
        // =========================================================
        map.addSource('ortho-source', {
          type: 'raster',
          tiles: ['rgb pemetaan 3/{z}/{x}/{y}.png'], // Memanggil tile PNG Anda
          tileSize: 256,
          maxzoom: 21
        });
        map.addLayer({
          id: 'ortho-layer',
          type: 'raster',
          source: 'ortho-source'
        });

        // =========================================================
        // FASE 4: Menambahkan Garis Kontur (kontur.geojson)
        // =========================================================
        map.addSource('contour-source', {
          type: 'geojson',
          data: 'kontur.geojson'
        });
        map.addLayer({
          id: 'contour-line',
          type: 'line',
          source: 'contour-source',
          paint: {
            'line-color': '#f59e0b', // Warna oranye
            'line-width': 1.5,
            'line-opacity': 0.7
          }
        });
        
        // Label Angka Elevasi Kontur (ELEV)
        map.addLayer({
          id: 'contour-label',
          type: 'symbol',
          source: 'contour-source',
          layout: {
            'symbol-placement': 'line',
            'text-field': ['get', 'ELEV'], // Membaca kolom ELEV dari QGIS
            'text-font': ['Open Sans Semibold'],
            'text-size': 11,
            'text-allow-overlap': false
          },
          paint: {
            'text-color': '#fff',
            'text-halo-color': 'rgba(0,0,0,0.8)',
            'text-halo-width': 1.5
          }
        });

        // =========================================================
        // FASE 5: Menambahkan Garis ROW (row.geojson)
        // =========================================================
        map.addSource('row-source', { type: 'geojson', data: 'row.geojson' });
        map.addLayer({
          id: 'row-line',
          type: 'line',
          source: 'row-source',
          paint: { 'line-color': '#f43f5e', 'line-width': 4 }
        });
      });
    }

    // Fungsi Sakelar Checklist Layer
    function toggleLayer(layerId, isVisible) {
      if (!map.getLayer(layerId)) return;
      map.setLayoutProperty(layerId, 'visibility', isVisible ? 'visible' : 'none');
      if (layerId === 'contour-line') map.setLayoutProperty('contour-label', 'visibility', isVisible ? 'visible' : 'none');
    }

    // Simulasi Kalkulator Cut & Fill
    document.getElementById('btnSimulateCalc').addEventListener('click', () => {
      const btn = document.getElementById('btnSimulateCalc');
      btn.textContent = 'Memindai Elevasi Pixel...';
      btn.style.background = '#f59e0b';
      
      // Animasi Loading Palsu selama 1 detik (Sebelum integrasi rumus integrasi Grid Prismoidal)
      setTimeout(() => {
        const target = parseFloat(document.getElementById('targetElev').value) || 0;
        // Rumus simulasi acak berdasarkan target elevasi
        const mockCut = Math.abs(115 - target) * 4500 + Math.floor(Math.random() * 5000);
        const mockFill = Math.abs(110 - target) * 3200 + Math.floor(Math.random() * 2000);
        
        document.getElementById('resCut').textContent = mockCut.toLocaleString('id-ID') + ' m³';
        document.getElementById('resFill').textContent = mockFill.toLocaleString('id-ID') + ' m³';
        
        btn.textContent = 'Simulasikan Hitung Area Tengah Peta';
        btn.style.background = '#38bdf8';
      }, 1200);
    });

    // Jalankan inisialisasi
    initTerrainAndLayers();

  </script>
</body>
</html>
